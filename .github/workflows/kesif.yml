name: Mağaza keşfi
# Aday mağazaları dener; uygun olanları "inceleniyor" durumunda ekler (haftada bir + elle).
on:
  workflow_dispatch:
    inputs:
      aday:
        description: "Yalnızca bu alan adı (boş = listedeki hepsi)"
        required: false
      yeniden:
        description: "Daha önce eklenen otomatik mağazaları da yeniden dene (evet/boş)"
        required: false
  schedule:
    - cron: "23 3 * * 1"
permissions:
  contents: read
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SORGU_ZAMAN_ASIMI_MS: "60000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keşif
        run: |
          EK="--db"
          [ -n "${{ inputs.aday }}" ] && EK="$EK --aday ${{ inputs.aday }}"
          [ "${{ inputs.yeniden }}" = "evet" ] && EK="$EK --yeniden"
          node --experimental-strip-types scripts/kesif.ts $EK
