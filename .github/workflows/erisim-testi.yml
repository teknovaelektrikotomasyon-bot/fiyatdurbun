name: Erişim testi
on:
  workflow_dispatch:
  push:
    paths:
      - "lib/toplayici/**"
      - "scripts/erisim-testi.ts"
      - ".github/workflows/erisim-testi.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types scripts/erisim-testi.ts
