name: Görsel erişim denemesi (geçici)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for row in $(jq -r 'to_entries[] | "\(.key)|\(.value)"' .gecici/g.json); do
            m=${row%%|*}; u=${row#*|}
            a=$(curl -s -o /tmp/a -w "%{http_code}:%{size_download}:%{content_type}" -H "Referer: https://fiyatdurbun.com/" -A "Mozilla/5.0 (Linux; Android 14) Chrome/130 Mobile" "$u")
            b=$(curl -s -o /tmp/b -w "%{http_code}:%{size_download}:%{content_type}" -A "Mozilla/5.0 (Linux; Android 14) Chrome/130 Mobile" "$u")
            echo "SONUC $m referer=$a yok=$b $(md5sum </tmp/a | cut -c1-8) $(md5sum </tmp/b | cut -c1-8)"
          done
