name: X paylaşımı
# Doğrulanmış gerçek indirimleri hazır X gönderisi olarak e-postayla yollar (ücretsiz). X API anahtarları tanımlanırsa doğrudan paylaşır.
on:
  schedule:
    - cron: "7 6 * * *" # Türkiye saatiyle 09:07, günde bir e-posta
  workflow_dispatch:
    inputs:
      deneme:
        description: "Göndermeden yalnızca metni yaz"
        type: boolean
        default: true
      adet:
        description: "Gönderi sayısı"
        default: "3"
permissions:
  contents: read
concurrency: x-paylas
jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://fiyatdurbun.com
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/x-paylas.ts --adet "${{ inputs.adet || '3' }}" ${{ inputs.deneme && '--deneme' || '' }}
