name: Barkod denemesi (geçici)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/barkod-dene.ts
