name: Fiyat toplama
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Mağaza başına en çok ürün (boş = hepsi)"
        required: false
      magaza:
        description: "Yalnızca bu mağaza (slug; boş = hepsi)"
        required: false
  schedule:
    - cron: "17 */6 * * *"   # 6 saatte bir
permissions:
  contents: write
# Elle başlatılan ve zamanlanmış turlar üst üste binmesin.
concurrency:
  group: topla
  cancel-in-progress: false
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SORGU_ZAMAN_ASIMI_MS: "60000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Topla
        run: |
          EK=""; [ -n "$DATABASE_URL" ] && EK="--db"
          [ -n "${{ inputs.magaza }}" ] && EK="$EK --magaza ${{ inputs.magaza }}"
          node --experimental-strip-types scripts/topla.ts --limit "${{ inputs.limit || 0 }}" --cikti veri/okunan.jsonl $EK
      - name: Takip bildirimleri
        if: env.DATABASE_URL != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: https://fiyatdurbun.com
        run: node --experimental-strip-types scripts/bildirim.ts
      - name: "Arama motorlarına bildir (IndexNow - Bing, Yandex)"
        if: env.DATABASE_URL != ''
        continue-on-error: true
        env:
          SITE_URL: https://fiyatdurbun.com
        run: node --experimental-strip-types scripts/indexnow.ts --son 7
      # Veritabanı bağlanana kadar ham okumalar "veri" dalında saklanır; fiyat geçmişi kaybolmaz, sonra içe aktarılır.
      - name: Ham veriyi sakla
        run: |
          DOSYA="okunan/$(date -u +%Y-%m-%d_%H%M).jsonl"
          mv veri/okunan.jsonl /tmp/okunan.jsonl
          git config user.name "fiyatdurbun-toplayici"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin veri:veri 2>/dev/null && git checkout veri || git checkout --orphan veri
          git rm -rfq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name okunan -exec rm -rf {} +
          mkdir -p okunan && mv /tmp/okunan.jsonl "$DOSYA"
          git add okunan && git commit -qm "Toplama $DOSYA" && git push -q origin veri
