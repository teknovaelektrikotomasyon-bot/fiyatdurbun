name: Kategori onarımı
# Eşleyici kuralları değişince mevcut ürünleri ham okumalara göre yeniden eşler. uygula=evet değilse yalnızca rapor.
on:
  workflow_dispatch:
    inputs:
      uygula:
        description: "Değişiklikleri uygula (evet/boş)"
        required: false
permissions:
  contents: read
concurrency:
  group: topla
  cancel-in-progress: false
jobs:
  onar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SORGU_ZAMAN_ASIMI_MS: "60000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: veri
          path: veri-dali
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/kategori-onar.ts veri-dali/okunan $([ "${{ inputs.uygula }}" = "evet" ] && echo --uygula)
