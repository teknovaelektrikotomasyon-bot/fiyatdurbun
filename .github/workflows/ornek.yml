name: Örnek ürün okuma
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ornek:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/ornek.ts
